<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- Tailwind -->
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <!-- Swiper -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">

  <!-- 1️⃣ Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>

</head>

<body>

  <!-- Contacts Table -->
  <div class="glass1 p-4 sm:p-6 rounded-lg mt-6 overflow-x-auto" id="dashboard" onclick="window.openSidebar()">

    <!-- 🔐 Logout Header -->
    <div class="flex justify-between items-center p-4">
      <h4 class="text-lg sm:text-xl font-semibold mb-3">All Contacts</h4>
      <button id="logoutBtn"
        class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition-all">
        <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
      </button>
    </div>

    <table id="contactsTable" class="w-full border-collapse text-sm sm:text-base">
      <thead>
        <tr class="bg-white/5 text-left">
          <th class="p-2 border-b border-white/10">ID</th>
          <th class="p-2 border-b border-white/10">Name</th>
          <th class="p-2 border-b border-white/10">Email</th>
          <th class="p-2 border-b border-white/10">Message</th>
          <th class="p-2 border-b border-white/10">Created At</th>
        </tr>

      </thead>
      <tbody id="contactsBody" class="divide-y divide-white/5">
        <!-- Rows will be injected by JS -->
      </tbody>
    </table>
  </div>



  <!-- client scripts (load socket.io client first) -->
  <!-- <script src="/socket.io/socket.io.js"></script> -->
  <!-- logic / client admin UI code -->
  <!-- <script src="../public/logic.js"></script> if you have it -->
  <!-- <script src="../public/routes/admin.js"></script> client-side version, see below -->
  <!-- <script src="../public/login-modal.js"></script> -->

  <!-- check session via cookie (use credentials include so cookie is sent automatically) -->
  <!-- Verify Session -->
  <script>
    (async () => {
      try {
        const res = await fetch('/auth/verify', { credentials: 'include' });
        const data = await res.json();
        if (!res.ok || !data.valid) {
          // not authenticated -> go back to home
          localStorage.removeItem('auth_token'); // cleanup if used elsewhere
          window.location.href = '/';
        }
      } catch (err) {
        console.error('Verify check failed', err);
        window.location.href = '/';
      }
    })();
  </script>


  <!-- 🚪 Logout Script -->
  <script>
    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
      try {
        await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
      } catch (err) { console.error(err); }
      localStorage.removeItem('auth_token');
      window.location.href = '/';
    });
  </script>

  <script>
    window.openSidebar = () => {
      const sidebar = document.getElementById('sidebar');
      sidebar?.classList.toggle('hidden');
    };

  </script>



  <!-- APP SCRIPT -->
  <!-- <script src="js/logic.js"></script> -->
  <script src="./routes/admin.js"></script>
  <!-- <script src="./routes/auth.js"></script> -->
  <!-- <script src="js/login-modal.js"></script> -->


</body>

</html>
