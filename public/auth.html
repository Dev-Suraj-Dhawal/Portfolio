<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
    <!-- Signup -->
    <h2 class="text-2xl font-bold text-center mb-4">Sign Up</h2>
    <form id="signupForm" class="space-y-4">
      <input type="email" name="email" placeholder="Email"
        class="w-full p-2 border rounded-lg" required>
      <input type="tel" name="phone" placeholder="Phone Number"
        class="w-full p-2 border rounded-lg" required>
      <input type="password" name="password" placeholder="Password"
        class="w-full p-2 border rounded-lg" required>
      <button type="submit"
        class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600">
        Sign Up
      </button>
    </form>

    <!-- Login -->
    <h2 class="text-2xl font-bold text-center mt-8 mb-4">Login</h2>
    <form id="loginForm" class="space-y-4">
      <input type="email" name="email" placeholder="Email"
        class="w-full p-2 border rounded-lg" required>
      <input type="password" name="password" placeholder="Password"
        class="w-full p-2 border rounded-lg" required>
      <button type="submit"
        class="w-full bg-green-500 text-white p-2 rounded-lg hover:bg-green-600">
        Login
      </button>
    </form>

    <!-- Verify Code -->
    <h2 class="text-2xl font-bold text-center mt-8 mb-4">Verify Code</h2>
    <form id="verifyForm" class="space-y-4">
      <input type="text" name="code" placeholder="Verification Code"
        class="w-full p-2 border rounded-lg" required>
      <button type="submit"
        class="w-full bg-purple-500 text-white p-2 rounded-lg hover:bg-purple-600">
        Verify
      </button>
    </form>

    <!-- Reset Password -->
    <h2 class="text-2xl font-bold text-center mt-8 mb-4">Reset Password</h2>
    <form id="resetForm" class="space-y-4">
      <input type="email" name="email" placeholder="Email"
        class="w-full p-2 border rounded-lg" required>
      <input type="password" name="newPassword" placeholder="New Password"
        class="w-full p-2 border rounded-lg" required>
      <button type="submit"
        class="w-full bg-red-500 text-white p-2 rounded-lg hover:bg-red-600">
        Reset Password
      </button>
    </form>
  </div>

  <script>
    // 🔹 Signup
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch("/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      alert(await res.text());
    });

    // 🔹 Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      alert(await res.text());
    });

    // 🔹 Verify Code
    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch("/auth/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      alert(await res.text());
    });

    // 🔹 Reset Password
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch("/auth/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      alert(await res.text());
    });
  </script>
</body>
</html>
